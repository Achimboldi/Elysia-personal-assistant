<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务提醒</title>
    <link rel="stylesheet" href="reminder.css">
</head>
<body>
    <div class="reminder-container">
        <div class="reminder-header"></div>
        <div class="reminder-content">
            <div class="reminder-title" id="taskTitle"></div>
            <div class="reminder-time" id="taskRemaining"></div>
        </div>
        <div class="reminder-buttons">
            <button id="viewBtn" class="view-btn">查看任务</button>
            <button id="snoozeBtn" class="snooze-btn">稍后提醒</button>
        </div>
    </div>
    <script src="reminder.js"></script>
</body>
</html>
